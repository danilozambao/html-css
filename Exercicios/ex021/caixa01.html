<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixa</title>
    <style>

        /* Box-Level */

        h1{
            background-color: lightgreen;
            height: 300px;
            width: 300px;
            
            border: 10px solid darkcyan;

            padding: 20px;

            /*
            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;
            */

            margin: 10px;

            /*
            outline-width: 2px;
            outline-style: dashed;
            outline-color: blueviolet;
            */
    
            outline: 2px dashed blueviolet;
        }

        /* Inline-Box */

        a{
            border-width: 10px;
            border-style: solid;
            border-color: brown;

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;

            margin-top: 10px;
            margin-right: 10px;
            margin-bottom: 10px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa Box-level</h1>
    <br>
    <p>Paragrafos também são exemplos de box-level, mas os <a href="#">Links são exemplo de inline-level</a>. Vamos ver como tudo isso funciona.</p>
</body>
</html>
