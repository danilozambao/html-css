<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalizando Linkst</title>
    <style>
        body{
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif, 'Times New Roman', Times, serif;
        }
        h1{
            background-image: linear-gradient(to right, blue, magenta);
            text-align: center;
            color: antiquewhite;
            pointer-events: none;
        }
        a{
            color: blue;
            text-decoration: none;
            font-weight: bold;
            
        }
        a:visited{
            color: rgb(22, 38, 7); 
        }
        a:hover{
            text-decoration: underline;
            background-color: chartreuse;
            
        }
        a::after {
            content: " [Acessar Link]";
            text-decoration: none;
            font-weight: normal;
            color: lightslategray;
        }
            a::before {
            content: " [Acessar Link]";
            text-decoration: none;
            font-weight: normal;
            color: lightslategray;
            }
        
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://gustavoguanabara.github.io" target="_blank">Repositório do Github</a></li>
        <li><a href="https://youtube.com/cursoemvideo/" target="_blank">Canal do Youtube</a></li>
        <li><a href="https://www.cursoemvideo.com" target="_blank">Site do Curso em Vídeo</a></li>
    </ul>
</body>
</html>
